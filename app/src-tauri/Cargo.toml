[package]
name = "skeuo"
version = "0.1.0"
description = "Classic iPhone OS on your computer"
edition = "2021"
publish = false

[lib]
name = "skeuo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-dialog = "2"
